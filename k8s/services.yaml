apiVersion: v1
kind: Namespace
metadata:
  name: pr8
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service
  namespace: pr8
data:
  DATA_PATH: /data/users.sqlite3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-service-data
  namespace: pr8
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: pr8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: pr8-user-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        envFrom:
        - configMapRef:
            name: user-service
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          httpGet:
            path: /health
            port: 5001
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          httpGet:
            path: /health
            port: 5001
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: user-service-data
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: pr8
spec:
  selector:
    app: user-service
  ports:
  - port: 5001
    targetPort: 5001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service
  namespace: pr8
data:
  DATA_PATH: /data/orders.sqlite3
  USER_SERVICE_URL: http://user-service:5001
