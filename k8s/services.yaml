apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service
  namespace: pr8
data:
  DATA_PATH: /data/notifications.sqlite3
  RABBITMQ_URL: amqp://lab:lab-demo@rabbitmq:5672/%2F
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-service-data
  namespace: pr8
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: pr8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: pr8-order-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 5003
        envFrom:
        - configMapRef:
            name: notification-service
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        command:
        - uvicorn
        - notification_service.main:app
        - --host
        - 0.0.0.0
        - --port
        - '5003'
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          httpGet:
            path: /live
            port: 5003
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          httpGet:
            path: /health
            port: 5003
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: notification-service-data
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: pr8
spec:
  selector:
    app: notification-service
  ports:
  - port: 5003
    targetPort: 5003
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq
  namespace: pr8
data:
  RABBITMQ_DEFAULT_USER: lab
  RABBITMQ_DEFAULT_PASS: lab-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: pr8
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: pr8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672
        envFrom:
        - configMapRef:
            name: rabbitmq
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          tcpSocket:
            port: 5672
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          tcpSocket:
            port: 5672
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pr8
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
